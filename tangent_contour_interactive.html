<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constrained stationary point: tangency of curve and contour</title>
<style>
:root{--bg:#ffffff;--surface:#f6f5f2;--text:#1a1a19;--text2:#52514e;--muted:#898781;--border:#c3c2b7;--success:#0f7a3a;--radius:8px}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1e;--surface:#2a2a28;--text:#f0efec;--text2:#c3c2b7;--muted:#898781;--border:#4a4a46;--success:#5fd08a}}
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin-inline:auto}
h1{font-size:20px;font-weight:500;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--text2);font-size:14px}
.row{display:flex;align-items:center;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.row label{font-size:14px;color:var(--text2)}
.row input[type=range]{flex:1;min-width:160px}
button{background:transparent;color:var(--text);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 12px;font-size:14px;cursor:pointer}
button:hover{background:var(--surface)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 8px;font-size:12px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border-radius:var(--radius);padding:1rem}
.card .k{font-size:13px;color:var(--text2)}
.card .v{font-size:24px;font-weight:500}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Tangency means a stationary point on the curve</h1>
<p class="sub">Level curves of f(x, y) = x² + 2y², with the curve c(t) = (t, 1.2 + 0.5t − 0.15t²). Drag the point along the curve.</p>
<div class="row">
  <label for="t">Position on curve, t</label>
  <input type="range" id="t" min="-3" max="3" step="0.01" value="-2">
  <span id="tv" style="font-size:14px;font-weight:500;min-width:40px"></span>
  <button id="jump">Next stationary point</button>
</div>
<div class="grid">
  <svg id="L" viewBox="0 0 400 400" width="100%" role="img"><title>Contours of f with a curve</title></svg>
  <svg id="R" viewBox="0 0 260 400" width="100%" role="img"><title>Restricted function h(t)</title></svg>
</div>
<div class="legend">
  <span><i style="width:14px;height:3px;background:var(--text)"></i>curve c(t)</span>
  <span><i style="width:14px;height:3px;background:#2a78d6"></i>contour through the point</span>
  <span><i style="width:14px;height:0;border-top:2px dashed #eb6834"></i>tangent to curve</span>
  <span><i style="width:14px;height:3px;background:#1baf7a"></i>gradient of f</span>
</div>
<div class="cards">
  <div class="card"><div class="k">h(t) = f(c(t))</div><div class="v" id="hv"></div></div>
  <div class="card"><div class="k">h′(t) = ∇f · c′(t)</div><div class="v" id="dv"></div></div>
  <div class="card"><div class="k">Status</div><div id="st" style="font-size:16px;font-weight:500;padding-top:6px"></div></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg',S=200/3;
const yc=t=>1.2+0.5*t-0.15*t*t, dy=t=>0.5-0.3*t;
const h=t=>t*t+2*yc(t)**2;
const dh=t=>2*t+4*yc(t)*dy(t);
const X=x=>200+x*S, Y=y=>200-y*S;
const stat=[];
for(let a=-3;a<3;a+=0.001){const b=a+0.001;if(dh(a)*dh(b)<0){let lo=a,hi=b;for(let i=0;i<40;i++){const m=(lo+hi)/2;if(dh(lo)*dh(m)<=0)hi=m;else lo=m;}stat.push((lo+hi)/2);}}
const L=document.getElementById('L'),R=document.getElementById('R');
const V=n=>'var(--'+n+')';
const el=(p,n,a,txt)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;p.appendChild(e);return e;};
el(L,'defs',{}).innerHTML='<clipPath id="cp"><rect x="0" y="0" width="400" height="400"/></clipPath>';
el(L,'rect',{x:0,y:0,width:400,height:400,style:'fill:var(--surface)'});
el(L,'line',{x1:0,y1:200,x2:400,y2:200,style:'stroke:var(--border)','stroke-width':0.5});
el(L,'line',{x1:200,y1:0,x2:200,y2:400,style:'stroke:var(--border)','stroke-width':0.5});
const g=el(L,'g',{'clip-path':'url(#cp)'});
[0.5,1,2,3,4.5,6,8,10,13,16].forEach(c=>el(g,'ellipse',{cx:200,cy:200,rx:Math.sqrt(c)*S,ry:Math.sqrt(c/2)*S,fill:'none',style:'stroke:var(--muted)','stroke-width':1}));
[1,3,6,8].forEach(c=>el(L,'text',{x:X(Math.sqrt(c))+3,y:194,'font-size':11,style:'fill:var(--muted)'},c));
el(L,'text',{x:8,y:20,'font-size':12,style:'fill:var(--text2)'},'level curves of f(x, y) = x² + 2y²');
let pts='';for(let t=-3;t<=3.001;t+=0.05)pts+=X(t).toFixed(1)+','+Y(yc(t)).toFixed(1)+' ';
el(g,'polyline',{points:pts,fill:'none',style:'stroke:var(--text)','stroke-width':2.5,'stroke-linejoin':'round'});
stat.forEach(s=>el(L,'circle',{cx:X(s),cy:Y(yc(s)),r:3,fill:'none',style:'stroke:var(--text2)','stroke-width':1}));
const cur=el(g,'ellipse',{fill:'none',stroke:'#2a78d6','stroke-width':2.5});
const tan=el(g,'line',{stroke:'#eb6834','stroke-width':2,'stroke-dasharray':'6 4'});
const gl=el(L,'line',{stroke:'#1baf7a','stroke-width':2.5});
const gh=el(L,'polygon',{fill:'#1baf7a'});
const pt=el(L,'circle',{r:6,style:'fill:var(--text);stroke:var(--surface)','stroke-width':2});
el(L,'text',{x:X(3)-4,y:Y(yc(3))-10,'font-size':13,'text-anchor':'end',style:'fill:var(--text)'},'c(t)');
const pl=40,pr=245,pt0=40,pb=340,hmax=Math.max(...Array.from({length:61},(_,i)=>h(-3+i*0.1)))*1.05;
const RX=t=>pl+(t+3)/6*(pr-pl),RY=v=>pb-v/hmax*(pb-pt0);
el(R,'rect',{x:0,y:0,width:260,height:400,style:'fill:var(--surface)'});
el(R,'line',{x1:pl,y1:pb,x2:pr,y2:pb,style:'stroke:var(--border)'});
el(R,'line',{x1:pl,y1:pt0,x2:pl,y2:pb,style:'stroke:var(--border)'});
el(R,'text',{x:8,y:20,'font-size':12,style:'fill:var(--text2)'},'h(t) = f(c(t))');
el(R,'text',{x:pr,y:pb+18,'font-size':12,'text-anchor':'end',style:'fill:var(--muted)'},'t');
[-3,0,3].forEach(v=>el(R,'text',{x:RX(v),y:pb+16,'font-size':11,'text-anchor':'middle',style:'fill:var(--muted)'},v));
let hp='';for(let t=-3;t<=3.001;t+=0.05)hp+=RX(t).toFixed(1)+','+RY(h(t)).toFixed(1)+' ';
el(R,'polyline',{points:hp,fill:'none',style:'stroke:var(--text)','stroke-width':2.5,'stroke-linejoin':'round'});
stat.forEach(s=>el(R,'circle',{cx:RX(s),cy:RY(h(s)),r:3,fill:'none',style:'stroke:var(--text2)','stroke-width':1}));
const vl=el(R,'line',{y1:pt0,y2:pb,style:'stroke:var(--border)','stroke-dasharray':'3 3'});
const rt=el(R,'line',{stroke:'#eb6834','stroke-width':2.5});
const rp=el(R,'circle',{r:6,fill:'#2a78d6',style:'stroke:var(--surface)','stroke-width':2});
const sl=document.getElementById('t');
function upd(){
  const t=+sl.value,x=t,y=yc(t),f=x*x+2*y*y,d=dh(t);
  const tx=1,ty=dy(t),n=Math.hypot(tx,ty),ux=tx/n,uy=-ty/n;
  cur.setAttribute('cx',200);cur.setAttribute('cy',200);cur.setAttribute('rx',Math.sqrt(f)*S);cur.setAttribute('ry',Math.sqrt(f/2)*S);
  const px=X(x),py=Y(y);
  tan.setAttribute('x1',px-ux*70);tan.setAttribute('y1',py-uy*70);tan.setAttribute('x2',px+ux*70);tan.setAttribute('y2',py+uy*70);
  const gx=2*x,gy=4*y,gn=Math.hypot(gx,gy)||1,vx=gx/gn,vy=-gy/gn,len=Math.min(60,10+gn*8);
  const ex=px+vx*len,ey=py+vy*len,bx=ex-vx*10,by=ey-vy*10;
  gl.setAttribute('x1',px);gl.setAttribute('y1',py);gl.setAttribute('x2',bx);gl.setAttribute('y2',by);
  gh.setAttribute('points',ex+','+ey+' '+(bx-vy*5)+','+(by+vx*5)+' '+(bx+vy*5)+','+(by-vx*5));
  pt.setAttribute('cx',px);pt.setAttribute('cy',py);
  vl.setAttribute('x1',RX(t));vl.setAttribute('x2',RX(t));
  rp.setAttribute('cx',RX(t));rp.setAttribute('cy',RY(h(t)));
  const k=(pb-pt0)/hmax/((pr-pl)/6),sx=25,sy=-d*k*sx;
  rt.setAttribute('x1',RX(t)-sx);rt.setAttribute('y1',RY(h(t))-sy);rt.setAttribute('x2',RX(t)+sx);rt.setAttribute('y2',RY(h(t))+sy);
  document.getElementById('tv').textContent=t.toFixed(2);
  document.getElementById('hv').textContent=f.toFixed(2);
  document.getElementById('dv').textContent=d.toFixed(2);
  const s=document.getElementById('st'),on=Math.abs(d)<0.08;
  s.textContent=on?'Tangent: stationary':'Crossing the contour';
  s.style.color=on?'var(--success)':'var(--text2)';
}
sl.addEventListener('input',upd);
document.getElementById('jump').addEventListener('click',()=>{const t=+sl.value;const nx=stat.find(s=>s>t+0.02);sl.value=(nx===undefined?stat[0]:nx).toFixed(2);upd();});
upd();
</script>
</body>
</html>
